name: Hornet Link CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Programs/dcsbios-serial-bridge/**'
      - 'libraries/**'
      - 'sketches/**'
      - 'tests/**'
      - 'docs/**'
      - 'Doxyfile'
      - '.clang-tidy'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Programs/dcsbios-serial-bridge/**'
      - 'libraries/**'
      - 'sketches/**'
      - 'tests/**'
      - 'docs/**'
      - 'Doxyfile'
      - '.clang-tidy'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  # ── C++ unit tests ─────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests (Windows / MSVC)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure CMake
        run: cmake -S tests -B tests/build -G "Visual Studio 17 2022" -A x64

      - name: Build tests
        run: cmake --build tests/build --config Release

      - name: Run tests
        run: ctest --test-dir tests/build -C Release --output-on-failure

  unit-tests-linux:
    name: Unit tests (Linux / GCC + ASan/UBSan)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure CMake
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug -DHORNET_LINK_SANITIZE=ON

      - name: Build tests
        run: cmake --build build-tests --parallel

      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  # ── Fuzzing smoke run ──────────────────────────────────────────────────────
  fuzz:
    name: Fuzz parsers (libFuzzer, short run)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure CMake
        run: cmake -S tests -B build-fuzz -DCMAKE_CXX_COMPILER=clang++ -DHORNET_LINK_FUZZ=ON

      - name: Build fuzz targets
        run: cmake --build build-fuzz --parallel

      - name: Run each target for 60 seconds
        run: |
          set -e
          for t in build-fuzz/fuzz/fuzz_*; do
            [ -x "$t" ] || continue
            echo "::group::$(basename "$t")"
            "$t" -max_total_time=60 -rss_limit_mb=2048 -artifact_prefix="$(basename "$t")-"
            echo "::endgroup::"
          done

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashes
          path: |
            fuzz_*-crash-*
            fuzz_*-leak-*
            fuzz_*-timeout-*
            fuzz_*-oom-*
          if-no-files-found: ignore

  # ── Cross-compile check (MinGW-w64) ────────────────────────────────────────
  build-mingw:
    name: Compile check (Linux / MinGW-w64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix

      - name: Compile bridge
        working-directory: Programs/dcsbios-serial-bridge
        run: >
          x86_64-w64-mingw32-g++-posix -std=c++17 -municode -mwindows
          -DUNICODE -D_UNICODE -DWIN32_LEAN_AND_MEAN -DNOMINMAX
          -Wall -Wextra -Werror -Wno-unknown-pragmas
          src/main.cpp -o hornet-link.exe -static
          -lws2_32 -lshlwapi -lcomdlg32

  # ── Lua lint ───────────────────────────────────────────────────────────────
  lua-lint:
    name: Lint Lua exporter (luacheck)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y lua-check

      - name: Run luacheck
        working-directory: Programs/dcsbios-serial-bridge/lua
        run: luacheck .

  # ── Windows MSVC build ─────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows / MSVC)
    runs-on: windows-2022
    needs: [unit-tests, unit-tests-linux]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure CMake
        working-directory: Programs/dcsbios-serial-bridge
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        working-directory: Programs/dcsbios-serial-bridge
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hornet-link-windows-x64
          path: Programs/dcsbios-serial-bridge/build/Release/hornet-link.exe

  # ── Static analysis ────────────────────────────────────────────────────────
  static-analysis:
    name: Static Analysis (clang-tidy, advisory)
    runs-on: windows-2022
    needs: build-windows
    continue-on-error: true  # Advisory until the baseline is clean

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install LLVM/clang-tidy
        run: choco install llvm ninja -y

      - name: Configure CMake with compile_commands
        working-directory: Programs/dcsbios-serial-bridge
        run: cmake -S . -B build-tidy -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Run clang-tidy
        working-directory: Programs/dcsbios-serial-bridge
        shell: pwsh
        run: |
          # Headers are checked through main.cpp via HeaderFilterRegex in .clang-tidy.
          clang-tidy src\main.cpp -p build-tidy --warnings-as-errors=*
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning::clang-tidy reported findings (advisory)"
            exit 1
          }

  # ── Arduino sketch compile check ───────────────────────────────────────────
  arduino-build:
    name: Verify Arduino sketches (arduino-cli)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0

      - name: Verify arduino-cli
        run: arduino-cli version

      - name: Install board cores
        run: |
          ESP32_URL="https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json"
          arduino-cli core update-index --additional-urls "$ESP32_URL"
          arduino-cli core install arduino:avr
          arduino-cli core install esp32:esp32 --additional-urls "$ESP32_URL"

      - name: Verify HornetLink library path
        run: |
          test -f "$GITHUB_WORKSPACE/libraries/HornetLink/src/HornetLink.h"

      - name: Compile Mega 2560 master sketch
        run: |
          arduino-cli compile \
            --libraries "$GITHUB_WORKSPACE/libraries" \
            --fqbn arduino:avr:mega \
            sketches/sketch_mega2560_master

      - name: Compile Pro Micro slave sketch
        run: |
          arduino-cli compile \
            --libraries "$GITHUB_WORKSPACE/libraries" \
            --fqbn arduino:avr:leonardo \
            sketches/sketch_pro_micro_slave

      - name: Compile ESP32 master sketch
        run: |
          arduino-cli compile \
            --libraries "$GITHUB_WORKSPACE/libraries" \
            --fqbn esp32:esp32:esp32 \
            sketches/sketch_esp32_master

  # ── Documentation build ────────────────────────────────────────────────────
  docs:
    name: Build Doxygen documentation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate docs
        run: doxygen Doxyfile 2>&1 | tee doxygen-output.log

      - name: Report warnings
        run: |
          count=$(grep -c "warning:" doxygen-output.log || true)
          echo "Doxygen warnings: $count"
          if [ "$count" -gt 0 ]; then
            echo "::warning::Doxygen reported $count warning(s)"
          fi
