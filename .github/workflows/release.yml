name: Hornet Link Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build packages and publish release
    runs-on: windows-2022
    permissions:
      contents: write  # required to create the release and upload assets

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check tag matches project version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $cm = Get-Content Programs/dcsbios-serial-bridge/CMakeLists.txt -Raw
          if ($cm -notmatch 'project\(hornet_link VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Could not read project VERSION from CMakeLists.txt"
          }
          $expected = "v$($Matches[1])"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $expected"
          }

      - name: Build and run unit tests
        run: |
          cmake -S tests -B tests/build -G "Visual Studio 17 2022" -A x64
          cmake --build tests/build --config Release
          ctest --test-dir tests/build -C Release --output-on-failure

      - name: Configure and build app
        working-directory: Programs/dcsbios-serial-bridge
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release

      - name: Build release zip bundle
        working-directory: Programs/dcsbios-serial-bridge
        shell: cmd
        run: build-package.cmd Release

      - name: Build CPack ZIP package
        working-directory: Programs/dcsbios-serial-bridge
        shell: cmd
        run: make-installer.cmd ZIP Release

      - name: Collect release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null

          Copy-Item "Programs/dcsbios-serial-bridge/dist/hornet-link-Release.zip" "release-assets/" -Force

          $cpackZip = Get-ChildItem "Programs/dcsbios-serial-bridge/build" -Filter "hornet-link-*-Windows.zip" | Select-Object -First 1
          if (-not $cpackZip) {
            throw "Expected CPack ZIP not found under Programs/dcsbios-serial-bridge/build"
          }
          Copy-Item $cpackZip.FullName "release-assets/" -Force

          Get-ChildItem "release-assets" -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "{0}  {1}" -f $hash.Hash.ToLower(), $_.Name
          } | Set-Content "release-assets/SHA256SUMS.txt" -Encoding utf8

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
